<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posts</title>
    <style> 
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .post {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .post img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 5px;
        }
        </style>
</head>
<body>
    <div class="topbar">
        <a href="{% url 'home' %}" class="btn">Back to Home</a>
        <a href="{% url 'create_post' %}" class="btn" style="margin-left:10px;">+ Create Post</a>
    </div>

    <h2>My Posts</h2>

    {% if posts %}
        {% for p in posts %}
            <div class="post">
                <h3>{{ p.title }}</h3>
                <p>{{ p.content }}</p>
                {% if p.photo %}
                    <img src="{{ p.photo.url }}" alt="photo">
                {% endif %}
                <small>Posted {{ p.created_at|date:"M j, Y, g:i a" }}</small>
                <div style="margin-top: 10px;">
                    <a href="{% url 'flag_content' %}?type=post&id={{ p.id }}" style="color: #ff6b6b; text-decoration: none; font-size: 14px;">🚩 Report</a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>You haven't posted anything yet.</p>
    {% endif %}
    
</body>
</html>
