<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Chat</title>
    <style>
      body {
        font-family: 'Helvetica Neue', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #e8eff1;
        margin: 0;
        color: #333;
      }

      .lobby-container {
        background: #ffffff;
        padding: 40px 50px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 320px;
      }

      .lobby-container h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 24px;
        color: #0a3d62;
      }

      .lobby-container form {
        display: flex;
        flex-direction: column;
      }

      .lobby-container input {
        margin-bottom: 15px;
        padding: 12px;
        border: 1px solid #ced6e0;
        border-radius: 6px;
        font-size: 16px;
      }

      .lobby-container button {
        padding: 12px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      .lobby-container button:hover {
        background-color: #27ae60;
      }

      .messages {
        list-style-type: none;
        padding: 0;
        margin-bottom: 15px;
      }

      .messages li {
        color: red;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="lobby-container">
      <h2>Start a New Chat</h2>

      {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      {% if user.is_authenticated %}
        <p style="text-align:center;">
          Logged in as: <strong>{{ user.username }}</strong>
        </p>
      {% endif %}

      <form method="post" action="{% url 'messaging:lobby' %}">
        {% csrf_token %}
        <input type="text" name="usernames" placeholder="Enter usernames, comma separated" required>
        <button type="submit">Start Chat</button>
      </form>
      <form action="{% url 'home' %}" method="get" style="margin-top:15px;">
        <button type="submit" style="width:100%; background:#0a3d62; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer;">
          Back to Home
        </button>
      </form>
    </div>
  </body>
</html>
