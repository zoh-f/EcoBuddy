<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Content - EcoBuddy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fff7e6;
            color: #222;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #f9f9f9;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
        }
        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .info-box {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0070f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Report Content</h1>

        <div class="info-box">
            <p>You are reporting {{ content_type }} content. Our moderators will review your report.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="reason">Reason for reporting:</label>
                <select id="reason" name="reason" required>
                    <option value="">Select a reason...</option>
                    <option value="spam">Spam or Advertising</option>
                    <option value="harassment">Harassment or Bullying</option>
                    <option value="inappropriate">Inappropriate Content</option>
                    <option value="misinformation">Misinformation</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Additional details (optional):</label>
                <textarea id="description" name="description" placeholder="Provide any additional context..."></textarea>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Submit Report</button>
                <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
